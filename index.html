main{max-width:520px;margin:0 auto;padding:14px 18px 150px}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 16px}
.top h1{font:700 1.75rem/1.1 var(--fd);letter-spacing:-.02em;margin:0}
.tt{flex:1;min-width:0}.tt small{display:block}
.logo{width:46px;height:46px;border-radius:15px;background:#f6dc8c;color:#4a3b00;display:grid;place-items:center;font-weight:800;flex:none}
.ico{width:44px;height:44px;border-radius:50%;padding:0;font-size:1.25rem;background:var(--card);color:var(--tx);border:1px solid var(--bd);flex:none;cursor:pointer}
small,.mu{color:var(--mu)}
h2,h3{font-family:var(--fd);font-weight:700;margin:0 0 6px;letter-spacing:-.01em}h3{font-size:1.25rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;margin:0 0 14px;box-shadow:var(--sh)}
button{font-family:var(--fb);font-size:.9375rem;font-weight:600}
.b{border:1.5px solid var(--bd);border-radius:999px;padding:11px 18px;background:var(--card);color:var(--tx);cursor:pointer;transition:transform .15s}
.b:active{transform:scale(.97)}
.b.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.b.u{background:var(--acs);color:var(--ac);border-color:transparent}
.b.r{background:var(--rd);color:var(--rt);border-color:transparent}.b.big{padding:15px 28px;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
label{display:block;font-size:.8125rem;font-weight:500;color:var(--mu);margin:12px 0 4px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
nav{position:fixed;left:12px;right:12px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;display:flex;padding:6px;gap:2px;border:1px solid var(--bd);border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(26,31,28,.16);z-index:10}
nav button{flex:1;background:transparent;color:var(--mu);border:0;border-radius:26px;padding:12px 2px;font-size:.78rem;font-weight:500;cursor:pointer}
nav button.on{background:var(--acs);color:var(--ac);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:2rem;display:none;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:11;padding:0;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}.chip{border:0;border-radius:999px;padding:9px 16px;background:var(--soft);color:var(--tx);white-space:nowrap;cursor:pointer}.chip.on{background:var(--ac);color:var(--acx)}
.cc{cursor:pointer}.cn{font:700 1.35rem var(--fd)}.cm{margin-top:8px;font-weight:600;color:var(--ac)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 8px 20px}
.moneda{width:92px;height:92px;border-radius:30px;background:var(--acs);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:var(--ac);margin-bottom:26px;box-shadow:0 8px 32px rgba(47,111,94,.16)}
.hero-t{font:800 clamp(1.9rem,7vw,2.5rem)/1.1 var(--fd);letter-spacing:-.03em;margin:0 0 10px}
.hero-p{color:var(--mu);font-size:1.05rem;max-width:300px;margin:0}
.dots{display:flex;gap:8px;justify-content:center;margin:20px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--ac);width:26px;border-radius:6px}
.wl{min-height:88vh;display:flex;flex-direction:column;justify-content:center}.wbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.steps{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:14px}.steps li{display:flex;gap:12px;align-items:flex-start}
.paso{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--acx);font-weight:700;display:flex;align-items:center;justify-content:center}
.copyright{text-align:center;font-size:12px;color:var(--mu);margin:22px 0 8px}
.st{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}
.st .n{width:26px;color:var(--mu);text-align:right}.st .nm{flex:1 1 50%;font-weight:600}
.AR{background:var(--bl)}.REC{background:var(--ok)}.DISC{background:var(--rd)}
.cond{width:auto;padding:6px 8px}
.at{width:46px;height:42px;padding:0;font-weight:700;border-radius:12px}
.P{background:var(--ok)}.A{background:var(--rd)}.T{background:var(--ye)}.J{background:var(--pu)}
.sc{width:84px;text-align:center}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:8px;text-align:center}
th{background:var(--hd)}td:first-child{text-align:left}.wrap{overflow-x:auto}
.pt{min-width:0}.pt td,.pt th{padding:6px 8px;white-space:nowrap}.pt th.act{max-width:110px;white-space:normal;cursor:pointer;font-size:14px}
.pt td:first-child,.pt th.fx{position:sticky;left:0;z-index:2;background:var(--card);min-width:150px;max-width:170px;white-space:normal;text-align:left;font-weight:600}
.pt th.fx{background:var(--hd)}.pt .pm{background:var(--bl);font-weight:700}
.cs{width:56px;padding:6px 4px;text-align:center}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:12px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.kpis div{background:var(--soft);border-radius:14px;padding:10px 12px}.kpis b{display:block;font:700 1.25rem var(--fd)}
.pill{padding:6px 12px;border-radius:999px;font-size:.8125rem;font-weight:700;white-space:nowrap}.pill.ok{background:var(--ok)}.pill.par{background:var(--ye)}.pill.deb{background:var(--rd)}.pill.ex{background:var(--soft);color:var(--mu)}
#dlg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#dlg>div{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:460px;max-height:85vh;overflow:auto}
details{border:1px solid var(--bd);border-radius:14px;padding:10px;margin:10px 0;background:var(--card)}summary{font-weight:700}

<div id="app"></div><div id="dlg"></div>
<nav id="nav" style="display:none"></nav><button id="fab" class="fab" aria-label="Agregar" onclick="fab()">＋</button>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none" onchange="scanFile(this)">
<script>
const KEY='planilla_docente_v1';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.courses)S={courses:[],period:'2c'};
S.cfg=S.cfg||{remind:7,last:0};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PER={'1c':'1.º cuatrimestre','2c':'2.º cuatrimestre'};
const TYPES={tp:'Trabajos prácticos',esc:'Evaluaciones escritas',ora:'Evaluaciones orales',car:'Carpeta'};
const TABS=[['est','Estudiantes'],['asi','Asistencia'],['tp','TP'],['esc','Escritas'],['ora','Orales'],['car','Carpeta'],['pro','Planilla de notas'],['inf','Informes']];
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
let cur=null,view='home',tab='est',date=today();
const C=()=>S.courses.find(c=>c.id===cur);
const fmt=d=>d.split('-').reverse().join('/');

/* diálogo propio (los prompt() del navegador pueden fallar) */
function dlg(title,body,ok,cb){
  const d=$('#dlg');d.style.display='flex';
  d.innerHTML=`<div><h3>${title}</h3><div style="margin:12px 0">${body}</div><div class="row" style="justify-content:flex-end"><button class="b" id="dx">Cerrar</button>${ok?`<button class="b p" id="dok">${ok}</button>`:''}</div></div>`;
  $('#dx').onclick=()=>d.style.display='none';
  if(ok)$('#dok').onclick=()=>{if(cb()!==false)d.style.display='none'};
}
const val=id=>($('#'+id).value||'').trim();

function R(){$('#app').innerHTML=!S.cfg.welcomed?welcome():cur?course():view==='cfg'?cfg():home();setNav();document.body.classList.toggle('bgfoto',bgOn())}
function home(){const hi=S.cfg.teacher?'Hola, '+S.cfg.teacher.split(' ')[0]:'Mis cursos';
return `<main>${top(hi,S.cfg.school||'Planilla Docente')}${remBanner()}
${S.courses.length?S.courses.map(c=>`<div class="card cc" onclick="openC('${c.id}')"><div class="cn">${esc(c.name)}</div><small>${esc(c.school||'')} ${esc(c.turno||'')}</small><div class="cm">${c.students.length} alumnos</div></div>`).join(''):emptyHome()}${foot()}</main>`}
function openC(id){cur=id;tab='est';R();scrollTo(0,0)}
function back(){cur=null;R()}
function addCourse(){dlg('Nuevo curso',`<input id="f1" placeholder="Materia y curso (ej: Geografía · 1.º D)"><br><br><input id="f2" value="${esc(S.cfg.school||'')}" placeholder="Escuela"><br><br><input id="f3" placeholder="Turno (ej: Tarde)">`,'Crear',()=>{
  if(!val('f1'))return false;
  S.courses.push({id:uid(),name:val('f1'),school:val('f2'),turno:val('f3'),students:[],att:{},items:[],inf:{}});save();R()})}
function delCourse(){dlg('Eliminar curso','¿Seguro? Se borran alumnos, asistencia y notas de este curso.','Eliminar',()=>{S.courses=S.courses.filter(c=>c.id!==cur);cur=null;save();R()})}

function course(){const c=C(),isN=GT.includes(tab)||tab==='pro';
return `<main>${top(c.name,(c.school||'')+(c.turno?' · '+c.turno:''),'back()')}
${isN?`<div class="chips">${GT.concat('pro').map(t=>`<button class="chip ${tab===t?'on':''}" onclick="tab='${t}';R()">${GS[t]}</button>`).join('')}</div>`:''}

const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=n=>n==null?'–':(Math.round(n*100)/100).toString().replace('.',',');

cols.forEach(g=>{g.a.forEach(i=>{r+=`<td><input class="cs" inputmode="decimal" value="${i.sc[s.id]==null?'':i.sc[s.id]}" oninput="cellSc('${i.id}','${s.id}',this.value)"></td>`});r+=`<td class="pm" id="av_${s.id}_${g.t}">${f1(o[g.t])}</td>`});
return `<tr>${r}<td class="pm" id="av_${s.id}_gen"><b>${f1(o.gen)}</b></td><td>${attPct(c,s.id)}</td></tr>`}).join('');
const n=c.items.filter(i=>i.per===per).length;
return `<div class="card"><h3>Planilla de notas</h3><small>${PER[per]} · acá ves todas las notas de cada alumno, actividad por actividad. Podés escribir o corregir una nota directamente en la tabla. Deslizá hacia los costados para ver más columnas. «Prom.» es el promedio de cada tipo y «Final» es el promedio de esos promedios. Tocá el título de una actividad para ir a su pestaña.</small>

/* ---------- importar nombres (texto, PDF u OCR) ---------- */
const HEADW=/\b(nombres?|alumn[oa]s?|apellidos?|cursos?|documentos?|dni|lista|planilla|materia|division|asistencia|profesor[a]?|docente|turno|ciclo|fecha|promedio|notas?|total|observaciones?|trabajos?|cuatrimestre|trimestre|escuela|colegio)\b/;
const noacc=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const nl=x=>(x.match(/\p{L}/gu)||[]).length;
function parseNamesEx(raw){const seen=new Set(),items=[];let dropped=0;
 raw.replace(/(\d{7,8}\s*\d\s*[°º]\s*[A-Za-z])\s+/g,'$1\n').split('\n').forEach(l=>{
  l=l.trim();if(!l)return;
  if(HEADW.test(noacc(l))){dropped++;return}
  l=l.replace(/^\s*\d+\s*[.)\-–:]*\s*/,'').replace(/\d{7,8}.*$/,'');
  const t=l.split(/\s+/).filter(x=>nl(x)>0);
  while(t.length>2&&nl(t[t.length-1])<=1)t.pop();
  const n=t.join(' ').replace(/[|_\[\]{}]/g,'').trim();
  if(n.length<3){if(/\p{L}{2}/u.test(l))dropped++;return}
  const key=n.toLowerCase();if(seen.has(key))return;seen.add(key);
  items.push({n,ok:!(t.length<2||/\d/.test(n)||n.length<5)})});
 return {items,dropped}}
const parseNames=raw=>parseNamesEx(raw).items.map(x=>x.n);
function review(items,dropped){const ok=items.filter(x=>x.ok).length,dd=items.length-ok;
 dlg('Revisá la lista',`<small>${ok} nombres listos${dd?' y '+dd+' para revisar (sin tildar, en amarillo)':''}.${dropped?' Se descartaron '+dropped+' líneas que parecían títulos o ruido.':''} Corregí o destildá lo que esté mal antes de agregar.</small>
<div id="rv" style="margin-top:10px">${items.map(x=>`<div class="row" style="flex-wrap:nowrap;margin:6px 0"><input type="checkbox" class="ck" ${x.ok?'checked':''} style="width:26px;height:26px;padding:0;flex:none"><input class="rn" value="${esc(x.n)}" style="${x.ok?'':'background:var(--ye)'}"></div>`).join('')||'<p class="mu">No se encontraron nombres. Probá con otra foto.</p>'}</div>`,
 'Agregar los tildados',()=>{const out=[];document.querySelectorAll('#rv .row').forEach(r=>{if(r.querySelector('.ck').checked)out.push(r.querySelector('.rn').value)});addNames(out)})}
function addNames(list){const c=C();const have=new Set(c.students.map(s=>s.name.toLowerCase()));
 list.forEach(x=>{x=x.replace(/\s+/g,' ').trim();if(x.length>2&&!have.has(x.toLowerCase())){have.add(x.toLowerCase());c.students.push({id:uid(),name:x,cond:''})}});save();R()}

/* ---------- cámara: leer lista impresa (OCR) ---------- */
function loadOcr(){return new Promise((ok,no)=>{if(window.Tesseract)return ok();const t=document.createElement('script');
 t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';t.onload=ok;t.onerror=()=>no(new Error('sin internet'));document.head.appendChild(t)})}
async function shrink(f){const b=await createImageBitmap(f);const k=Math.min(1,2000/Math.max(b.width,b.height));
 const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c}
function scanSt(){$('#cam').value='';$('#cam').click()}
async function scanFile(inp){const f=inp.files[0];if(!f)return;
 dlg('Leyendo la lista...','<div id="ocrst">Preparando el lector de texto (la primera vez necesita internet)...</div>');
 try{await loadOcr();const img=await shrink(f);
  const lg=m=>{const e=$('#ocrst');if(e&&m.status)e.textContent=m.status+(m.progress?' '+Math.round(m.progress*100)+'%':'')};
  const w=await Tesseract.createWorker('spa',1,{logger:lg});
  try{await w.setParameters({tessedit_pageseg_mode:'6'})}catch(e){}
  const r=await w.recognize(img);try{await w.terminate()}catch(e){}
  const p=parseNamesEx(r.data.text);review(p.items,p.dropped)
 }catch(e){dlg('No se pudo leer','Revisá la conexión a internet (la primera vez baja el lector de texto) y probá con una foto bien iluminada y derecha. Mientras tanto podés usar «Pegar o importar una lista».')}}

/* ---------- ajustes ---------- */
function bkFile(){return new File([JSON.stringify(S)],'planilla-docente-'+today()+'.json',{type:'application/json'})}
function markBk(){S.cfg.last=Date.now();save();R()}
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
async function bkNative(){const FS=Capacitor.registerPlugin('Filesystem'),Sh=Capacitor.registerPlugin('Share');
 const r=await FS.writeFile({path:'planilla-docente-'+today()+'.json',data:JSON.stringify(S),directory:'CACHE',encoding:'utf8'});
 await Sh.share({title:'Copia Planilla Docente',url:r.uri});markBk()}
const bkErr=e=>{if(!/cancel/i.test(String((e&&e.message)||e)))backup()};

 const f=bkFile();if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Copia Planilla Docente'});markBk()}catch(e){}}else bkSave()}
function bkRestore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.courses)throw 0;
  dlg('Restaurar copia','Se reemplazan todos los datos actuales por los del archivo ('+o.courses.length+' cursos). ¿Seguir?','Restaurar',()=>{snap();S=o;S.cfg=S.cfg||{remind:7,last:0};save();cur=null;view='home';R()})}
  catch(e){dlg('Archivo no válido','Ese archivo no es una copia de la Planilla Docente.')}};r.readAsText(f)}

<div class="card"><h3>Guardado automático</h3><small>Todo lo que cargás se guarda solo, al instante. Además, cada vez que cerrás o salís de la app se crea una copia (se guardan las últimas 5). No hace falta tocar «Guardar».</small>

${sn.map(x=>`<div class="st"><span class="nm">${fdt(x.t)}</span><button class="b" onclick="restSnap(${x.t})">Restaurar</button></div>`).join('')}</div>
<div class="card"><h3>Copia en el teléfono</h3><small>Guarda un archivo con todos tus cursos, alumnos y notas. Guardalo en Descargas o mandátelo por WhatsApp o mail.</small>
<div class="row" style="margin:10px 0"><button class="b p" onclick="bkSave()">Guardar archivo</button><button class="b" onclick="bkShare()">Compartir copia</button></div>

/* ---------- versión y actualizaciones ---------- */
const APP_VERSION='2.0.2',APP_DATE='04/11/2026';
const CHANGELOG=[['2.0.2','06/11/2026','El lector de listas ignora títulos y números, y muestra una revisión con tildes antes de agregar alumnos.'],['2.0.1','05/11/2026','Cobros: pagos en partes y monto distinto por alumno.'],['2.0.0','05/11/2026','Diseño nuevo, menú inferior, botón ＋, pantallas de bienvenida, datos del docente y sección Cobros (fotocopias y resmas).'],['1.3.0','04/11/2026','Preparada para generar el APK de Android (copia en archivo con compartir nativo).'],['1.2.0','04/11/2026','Pantalla de versión y buscador de actualizaciones.'],['1.1.0','04/11/2026','Cámara para escanear listas, Ajustes y copias automáticas.'],['1.0.0','04/11/2026','Cursos, estudiantes, asistencia, notas, planilla de notas e informes.']];
function verCard(){return `<div class="card"><h3>Versión de la app</h3><p><b>Versión ${APP_VERSION}</b> · ${APP_DATE}</p><small>Novedades:</small><ul style="margin:6px 0;padding-left:20px">${CHANGELOG.map(x=>`<li><b>${x[0]}</b> (${x[1]}): ${x[2]}</li>`).join('')}</ul><div class="row"><button class="b p" onclick="chkUpd()">Buscar actualización</button></div></div>`}
function newer(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)>(y[i]||0))return true;if((x[i]||0)<(y[i]||0))return false}return false}
async function chkUpd(){dlg('Buscando actualización...','<div>Consultando...</div>');
 try{const t=await (await fetch('index.html?'+Date.now(),{cache:'no-store'})).text();const m=t.match(/APP_VERSION='([\d.]+)'/);if(!m)throw 0;
  if(newer(m[1],APP_VERSION))dlg('Hay una versión nueva','Versión '+m[1]+' disponible (tenés la '+APP_VERSION+'). Tus datos no se tocan.','Actualizar',async()=>{try{const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}catch(e){}location.reload()});
  else dlg('Estás al día','Tenés la última versión ('+APP_VERSION+').')
 }catch(e){dlg('No se pudo comprobar','Hace falta internet para buscar actualizaciones.')}}

/* ---------- diseño v2: navegación, bienvenida ---------- */
const GS={tp:'TP',esc:'Escritas',ora:'Orales',car:'Carpeta',pro:'Planilla'};
const NAVC=[['est','Alumnos'],['asi','Asistencia'],['nt','Notas'],['cob','Cobros'],['inf','Informes']];
const inN=()=>GT.includes(tab)||tab==='pro';
const bgOn=()=>S.cfg.bg===undefined?/santa mar[ií]a|champagnat/i.test(S.cfg.school||''):!!S.cfg.bg;
const foot=()=>`<div class="copyright">Planilla Docente v${APP_VERSION} · © 2026 Martín Enrique Bustos</div>`;
function top(t,sub,back){return `<div class="top">${back?`<button class="ico" onclick="${back}" aria-label="Volver">←</button>`:'<div class="logo">PD</div>'}<div class="tt"><h1>${esc(t)}</h1>${sub?`<small>${esc(sub)}</small>`:''}</div></div>`}
function setNav(){const n=$('#nav'),f=$('#fab');
 if(!S.cfg.welcomed){n.style.display='none';f.style.display='none';return}
 n.style.display='flex';
 if(cur){const t=inN()?'nt':tab;n.innerHTML=NAVC.map(x=>`<button class="${t===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
  f.style.display=(tab==='est'||GT.includes(tab)||(tab==='cob'&&!ck))?'flex':'none'}
 else{n.innerHTML=`<button class="${view==='home'?'on':''}" onclick="view='home';R()">Cursos</button><button class="${view==='cfg'?'on':''}" onclick="view='cfg';R()">Ajustes</button>`;f.style.display=view==='home'?'flex':'none'}}
function go(t){tab=t==='nt'?(inN()?tab:'pro'):t;if(t==='cob')ck=null;R();scrollTo(0,0)}
function fab(){if(!cur)return addCourse();if(tab==='est')return stMenu();if(tab==='cob')return addCob();if(GT.includes(tab))return addItem(tab)}
function closeD(){$('#dlg').style.display='none'}
function stMenu(){dlg('Agregar alumnos','<div class="col"><button class="b p" onclick="closeD();scanSt()">📷 Escanear lista con la cámara</button><button class="b u" onclick="closeD();impSt()">Pegar o importar una lista</button><button class="b" onclick="closeD();addSt()">Agregar uno solo</button></div><p><small>Para leer mejor la foto: sacala de frente, con buena luz y, si podés, mostrando solo la columna de nombres.</small></p>')}
function emptyHome(){return `<div class="card"><h3>Empecemos</h3><ol class="steps"><li><span class="paso">1</span><div><b>Creá tu primer curso</b><br><small>Tocá el botón ＋ de abajo.</small></div></li><li><span class="paso">2</span><div><b>Cargá los alumnos</b><br><small>Con la cámara 📷 o pegando la lista.</small></div></li><li><span class="paso">3</span><div><b>Tomá asistencia y cargá notas</b><br><small>Todo se guarda solo.</small></div></li></ol></div>`}
function perfCard(){return `<div class="card"><h3>Mis datos</h3><small>Sirven para saludarte y completar la escuela al crear cursos.</small>
<label>Tu nombre</label><input value="${esc(S.cfg.teacher||'')}" onchange="S.cfg.teacher=this.value.trim();save()">
<label>Tu escuela</label><input value="${esc(S.cfg.school||'')}" onchange="S.cfg.school=this.value.trim();save();R()">
<label>Foto del Colegio Universitario Santa María de fondo</label><select onchange="S.cfg.bg=this.value==='1';save();R()"><option value="1" ${bgOn()?'selected':''}>Sí</option><option value="0" ${bgOn()?'':'selected'}>No</option></select>
<div class="row" style="margin-top:14px"><button class="b" onclick="S.cfg.welcomed=false;wst=0;R()">Ver la bienvenida otra vez</button></div></div>`}
let wst=0;
const WSL=[['PD','Bienvenido a Planilla Docente','Tus cursos, asistencia y notas, siempre a mano.'],['📋','Todo en un solo lugar','Alumnos, asistencia, trabajos prácticos, evaluaciones escritas y orales, carpeta, promedios e informes.'],['📷','Cargá listas con la cámara','Sacale una foto a la lista impresa y la app arma el curso por vos.'],['💰','Cobros claros','Anotá quién pagó las fotocopias o resmas, con fecha y monto. Nadie queda en duda.'],['💾','Se guarda solo','Cada cambio queda guardado, y se hace una copia automática cada vez que cerrás la app.']];
function welcome(){
 if(wst<WSL.length){const w=WSL[wst];return `<main class="wl"><div class="hero"><div class="moneda">${w[0]}</div><h1 class="hero-t">${w[1]}</h1><p class="hero-p">${w[2]}</p></div><div class="dots">${WSL.map((_,i)=>`<i class="${i===wst?'on':''}"></i>`).join('')}</div><div class="wbtn"><button class="b p big" onclick="wst++;R()">Siguiente</button>${wst<WSL.length-1?'<button class="b" onclick="wst=WSL.length;R()">Saltar</button>':''}</div></main>`}
 return `<main class="wl"><div class="hero"><div class="moneda">👋</div><h1 class="hero-t">Último paso</h1><p class="hero-p">Así la app te saluda por tu nombre.</p></div><div class="card"><label>Tu nombre</label><input id="wn" placeholder="Ej: Mariela" value="${esc(S.cfg.teacher||'')}"><label>Tu escuela</label><input id="ws" placeholder="Ej: Escuela Secundaria n.º 1" value="${esc(S.cfg.school||'')}"></div><div class="wbtn"><button class="b p big" onclick="wdone()">Empezar</button></div></main>`}
function wdone(){S.cfg.teacher=val('wn');S.cfg.school=val('ws');S.cfg.welcomed=true;save();view='home';cur=null;R()}

/* ---------- cobros (fotocopias, resmas) ---------- */
let ck=null,cflt='all';
const $m=n=>'$'+Math.round(n).toLocaleString('es-AR');
const numv=v=>{let t=String(v).trim().replace(/\$/g,'').replace(/\s/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');return parseFloat(t)||0};
const paid=(k,sid)=>(k.pays[sid]||[]).filter(p=>!p.v).reduce((a,p)=>a+p.m,0);
const owed=(k,sid)=>(k.cu&&k.cu[sid]!=null)?k.cu[sid]:k.amt;
const cst=(k,sid)=>k.ex[sid]?'ex':paid(k,sid)>=owed(k,sid)?'ok':paid(k,sid)>0?'par':'deb';
function tot(c,k){const L=c.students.filter(s=>!k.ex[s.id]);let rec=0,n=0;c.students.forEach(s=>rec+=paid(k,s.id));L.forEach(s=>{if(paid(k,s.id)>=owed(k,s.id))n++});
 const exp=L.reduce((a,s)=>a+owed(k,s.id),0);return {exp,rec,n,tot:L.length,pct:exp?Math.min(100,Math.round(rec*100/exp)):0}}
function cob(c){c.cob=c.cob||[];
 if(ck){const k=c.cob.find(x=>x.id===ck);if(k)return cobDet(c,k);ck=null}
 return `<div class="card"><h3>Cobros</h3><small>Dinero que juntás de los alumnos (fotocopias, resmas...). Cada pago queda anotado con fecha, así no hay dudas.</small></div>`+
 (c.cob.length?c.cob.map(k=>{const t=tot(c,k);return `<div class="card cc" onclick="ck='${k.id}';cflt='all';R()"><div class="cn">${esc(k.title)}</div><small>${$m(k.amt)} por alumno · ${fmt(k.date)}</small><div class="bar"><i style="width:${t.pct}%"></i></div><div class="row" style="justify-content:space-between"><b>${$m(t.rec)} de ${$m(t.exp)}</b><small>${t.n} de ${t.tot} pagaron</small></div></div>`}).join(''):'<div class="card"><small>Todavía no hay cobros. Tocá ＋ para crear el primero (por ejemplo «Fotocopias 2.º cuatrimestre»).</small></div>')}
function cobDet(c,k){const t=tot(c,k),buys=k.buys.reduce((a,b)=>a+b.m,0);
 const lbl=(s)=>{const st=cst(k,s.id),p=paid(k,s.id);return st==='ex'?'No paga':st==='ok'?'Pagó ✔':'Debe '+$m(owed(k,s.id)-p)};
 const rows=c.students.map((s,i)=>({s,i,st:cst(k,s.id)})).filter(x=>cflt==='all'||(cflt==='deb'&&(x.st==='deb'||x.st==='par'))||(cflt==='ok'&&x.st==='ok'))
  .map(x=>`<div class="st" style="cursor:pointer" onclick="payDlg('${k.id}','${x.s.id}')"><span class="n">${x.i+1}</span><span class="nm">${esc(x.s.name)}</span><span class="pill ${x.st}">${lbl(x.s)}</span></div>`).join('');
 return `<div class="row" style="margin-bottom:12px"><button class="b" onclick="ck=null;R()">← Cobros</button><button class="b" onclick="editCob('${k.id}')">Editar</button></div>
<div class="card"><h3>${esc(k.title)}</h3><small>${$m(k.amt)} por alumno · ${t.n} de ${t.tot} pagaron</small><div class="bar"><i style="width:${t.pct}%"></i></div>
<div class="kpis"><div><small>Recaudado</small><b>${$m(t.rec)}</b></div><div><small>Falta cobrar</small><b>${$m(Math.max(0,t.exp-t.rec))}</b></div><div><small>Gastado</small><b>${$m(buys)}</b></div><div><small>En mano</small><b>${$m(t.rec-buys)}</b></div></div></div>
<div class="chips">${[['all','Todos'],['deb','Deben'],['ok','Pagaron']].map(f=>`<button class="chip ${cflt===f[0]?'on':''}" onclick="cflt='${f[0]}';R()">${f[1]}</button>`).join('')}</div>
<div class="card" style="padding-top:8px">${rows||'<p class="mu">No hay alumnos en esta lista.</p>'}<small>Tocá un alumno para registrar un pago o ver su historial.</small></div>
<div class="card"><h3>Compras (resmas, tinta...)</h3>${k.buys.map(b=>`<div class="st"><span class="nm">${fmt(b.d)} · ${esc(b.t)}</span><b>${$m(b.m)}</b><button class="b r" onclick="delBuy('${k.id}','${b.id}')">✕</button></div>`).join('')||'<small>Todavía no registraste compras.</small>'}
<div class="row" style="margin-top:12px"><button class="b u" onclick="addBuy('${k.id}')">＋ Registrar compra</button></div></div>
<div class="row"><button class="b" onclick="copyDeb('${k.id}')">Lista de quienes deben</button><button class="b r" onclick="delCob('${k.id}')">Eliminar cobro</button></div>`}
function addCob(){dlg('Nuevo cobro',`<label>Para qué es</label><input id="f1" placeholder="Ej: Fotocopias 2.º cuatrimestre"><label>Monto por alumno ($)</label><input id="f2" inputmode="numeric" placeholder="Ej: 2000">`,'Crear',()=>{
 const m=numv(val('f2'));if(!val('f1')||m<=0)return false;const c=C();c.cob=c.cob||[];const k={id:uid(),title:val('f1'),amt:m,date:today(),pays:{},ex:{},cu:{},buys:[]};c.cob.push(k);ck=k.id;cflt='all';save();R()})}
function editCob(id){const k=C().cob.find(x=>x.id===id);dlg('Editar cobro',`<label>Para qué es</label><input id="f1" value="${esc(k.title)}"><label>Monto por alumno ($)</label><input id="f2" inputmode="numeric" value="${k.amt}"><small>Si cambiás el monto, se recalcula lo que debe cada alumno. Los pagos ya anotados no se tocan.</small>`,'Guardar',()=>{
 const m=numv(val('f2'));if(!val('f1')||m<=0)return false;k.title=val('f1');k.amt=m;save();R()})}
function delCob(id){dlg('Eliminar cobro','Se borran todos los pagos y compras de este cobro. No se puede deshacer.','Eliminar',()=>{const c=C();c.cob=c.cob.filter(x=>x.id!==id);ck=null;save();R()})}
function payDlg(kid,sid){const c=C(),k=c.cob.find(x=>x.id===kid),s=c.students.find(x=>x.id===sid);if(!k||!s)return;
 const p=paid(k,sid),rest=Math.max(0,owed(k,sid)-p),H=k.pays[sid]||[],ex=!!k.ex[sid];
 dlg(esc(s.name),`<small>${esc(k.title)} · ${$m(owed(k,sid))} · <b>${ex?'No paga':rest?'Debe '+$m(rest):'Pagó completo ✔'}</b></small>
${H.length?`<div style="margin:10px 0">${H.map(x=>`<div class="st" style="padding:6px 0"><span class="nm" style="${x.v?'text-decoration:line-through;opacity:.55':''}">${fmt(x.d)} · ${$m(x.m)}${x.n?' · '+esc(x.n):''}${x.v?' (anulado)':''}</span>${x.v?'':`<button class="b r" onclick="voidPay('${kid}','${sid}','${x.id}')">Anular</button>`}</div>`).join('')}</div>`:'<p class="mu">Todavía no pagó nada.</p>'}
<label>Monto que entrega ahora ($)</label><input id="pm" inputmode="numeric" value="${rest||''}"><small>Puede ser parcial: lo que falte queda anotado para la próxima.</small>
<label>Total que tiene que pagar este alumno ($)</label><input id="pt" inputmode="numeric" value="${owed(k,sid)}">
<label>Fecha</label><input id="pd" type="date" value="${today()}">
<label>Nota (opcional)</label><input id="pn" placeholder="Ej: lo trajo la mamá">
<div class="row" style="margin-top:12px"><button class="b" onclick="recibo('${kid}','${sid}')">Copiar recibo</button><button class="b" onclick="togEx('${kid}','${sid}')">${ex?'Volver a cobrarle':'No paga'}</button></div>`,
 'Registrar pago',()=>{const m=numv(val('pm')),nt=numv(val('pt'));let ch=false;
  if(nt>0&&nt!==owed(k,sid)){k.cu=k.cu||{};if(nt===k.amt)delete k.cu[sid];else k.cu[sid]=nt;ch=true}
  if(m<=0&&!ch)return false;
  if(m>0)(k.pays[sid]=k.pays[sid]||[]).push({id:uid(),d:val('pd')||today(),m,n:val('pn'),t:Date.now()});save();R()})}
function voidPay(kid,sid,pid){const k=C().cob.find(x=>x.id===kid),x=(k.pays[sid]||[]).find(y=>y.id===pid);
 dlg('Anular pago','El pago queda marcado como anulado. No se borra: queda el registro.','Anular',()=>{x.v=true;x.vt=Date.now();save();R();setTimeout(()=>payDlg(kid,sid),0)})}
function togEx(kid,sid){const k=C().cob.find(x=>x.id===kid);k.ex[sid]=!k.ex[sid];save();R();payDlg(kid,sid)}
function showTxt(t,x){try{navigator.clipboard&&navigator.clipboard.writeText(x)}catch(e){}dlg(t,`<small>Se copió el texto. Si no, mantené apretado y copialo desde acá.</small><textarea rows="9" readonly>${esc(x)}</textarea>`)}
function recibo(kid,sid){const c=C(),k=c.cob.find(x=>x.id===kid),s=c.students.find(x=>x.id===sid),L=(k.pays[sid]||[]).filter(x=>!x.v);
 if(!L.length)return dlg('Sin pagos','Todavía no hay pagos registrados para hacer un recibo.');
 const l=L[L.length-1],rest=Math.max(0,owed(k,sid)-paid(k,sid));
 showTxt('Recibo',`Recibí de ${s.name} ${$m(l.m)} el ${fmt(l.d)} (${k.title}). Total pagado: ${$m(paid(k,sid))}. ${rest?'Falta: '+$m(rest)+'.':'Pagó completo.'}${S.cfg.teacher?' — '+S.cfg.teacher:''}`)}
function copyDeb(kid){const c=C(),k=c.cob.find(x=>x.id===kid);
 const L=c.students.filter(s=>{const st=cst(k,s.id);return st==='deb'||st==='par'});
 showTxt('Quienes deben',L.length?k.title+' ('+$m(k.amt)+' c/u). Deben:\n'+L.map(s=>'- '+s.name+': '+$m(owed(k,s.id)-paid(k,s.id))).join('\n'):'Nadie debe nada en «'+k.title+'». ¡Todos al día!')}
function addBuy(kid){dlg('Registrar compra',`<label>Qué compraste</label><input id="f1" placeholder="Ej: 2 resmas de papel"><label>Monto ($)</label><input id="f2" inputmode="numeric"><label>Fecha</label><input id="f3" type="date" value="${today()}">`,'Guardar',()=>{
 const m=numv(val('f2'));if(!val('f1')||m<=0)return false;C().cob.find(x=>x.id===kid).buys.push({id:uid(),t:val('f1'),m,d:val('f3')||today()});save();R()})}
function delBuy(kid,bid){dlg('Quitar compra','¿Quitar esta compra del registro?','Quitar',()=>{const k=C().cob.find(x=>x.id===kid);k.buys=k.buys.filter(b=>b.id!==bid);save();R()})}
R();
</script></body></html>
