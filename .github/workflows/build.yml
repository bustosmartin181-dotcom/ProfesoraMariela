name: Generar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: 🚀 Construir APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}
        run: |
          # Inicializa el proyecto de forma automática usando el manifest web existente y compila sin interactividad
          bubblewrap init --manifest https://bustosmartin181-dotcom.github.io/ProfesoraMariela/manifest.json --directory . --skipValidation --jdkPath "$JAVA_HOME" || true
          bubblewrap build --jdkPath "$JAVA_HOME"

      - name: 💾 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          
