name: Generar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar PWABuilder CLI (Herramienta oficial sin interrupciones)
        run: npm install -g @pwabuilder/pwapack

      - name: 🚀 Construir APK automáticamente
        run: |
          # Genera el paquete para Android de forma totalmente desatendida
          pwapack generate --manifest https://bustosmartin181-dotcom.github.io/ProfesoraMariela/manifest.json --platforms android --output ./android-app

      - name: 📦 Compilar APK con Gradle
        run: |
          cd android-app/android
          chmod +x gradlew
          ./gradlew assembleRelease
          # Copiar el APK resultante a la raíz
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../app-release-signed.apk || cp app/build/outputs/apk/debug/app-release-debug.apk ../../app-release-signed.apk

      - name: 💾 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          
