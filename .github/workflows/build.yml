name: Generar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🚀 Generar y compilar APK con Bubblewrap Action
        uses: AlvarCart/bubblewrap-action@main
        with:
          manifest-url: 'https://bustosmartin181-dotcom.github.io/ProfesoraMariela/manifest.json'
          application-id: 'com.github.bustosmartin181dotcom.planilladocente'
          name: 'Planilla Docente'
          short-name: 'Planilla'
          theme-color: '#2f6f5e'
          background-color: '#faf8f5'
          start-url: '/ProfesoraMariela/'
          icon-url: 'https://bustosmartin181-dotcom.github.io/ProfesoraMariela/icon-512.png'

      - name: 💾 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          
