name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configurar Bubblewrap y licencias Android
        run: |
          bubblewrap updateConfig \
            --jdkPath "$JAVA_HOME" \
            --androidSdkPath "$ANDROID_HOME"

      - name: Crear configuración de la aplicación
        run: |
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.github.bustosmartin181dotcom.planilladocente",
            "host": "bustosmartin181-dotcom.github.io",
            "name": "Planilla Docente",
            "launcherName": "Planilla",
            "startUrl": "/ProfesoraMariela/",
            "display": "standalone",
            "orientation": "any",
            "themeColor": "#2f6f5e",
            "themeColorDark": "#2f6f5e",
            "backgroundColor": "#faf8f5",
            "navigationColor": "#2f6f5e",
            "navigationColorDark": "#14201d",
            "navigationDividerColor": "#2f6f5e",
            "navigationDividerColorDark": "#14201d",
            "iconUrl": "https://bustosmartin181-dotcom.github.io/ProfesoraMariela/icon-512.png",
            "maskableIconUrl": "https://bustosmartin181-dotcom.github.io/ProfesoraMariela/icon-512.png",
            "webManifestUrl": "https://bustosmartin181-dotcom.github.io/ProfesoraMariela/manifest.json",
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "minSdkVersion": 21,
            "splashScreenFadeOutDuration": 300,
            "enableNotifications": false,
            "fallbackType": "customtabs",
            "features": {},
            "shortcuts": [],
            "protocolHandlers": [],
            "isChromeOSOnly": false
          }
          EOF

      - name: Restaurar keystore de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.BUBBLEWRAP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Falta el secreto BUBBLEWRAP_KEYSTORE_BASE64." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Generar proyecto Android
        run: bubblewrap update --skipVersionUpgrade

      - name: Compilar APK firmado
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] || [ -z "$BUBBLEWRAP_KEY_PASSWORD" ]; then
            echo "Configura BUBBLEWRAP_KEYSTORE_PASSWORD y BUBBLEWRAP_KEY_PASSWORD en Actions secrets." >&2
            exit 1
          fi
          bubblewrap build --skipPwaValidation

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
