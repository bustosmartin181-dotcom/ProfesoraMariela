name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'iconos.zip'
      - 'debug.keystore'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Armar carpeta web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permiso de camara
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Icono de la app
        run: unzip -o iconos.zip -d android/app/src/main/res/

      - name: Firma fija y numero de version
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: planilla-docente-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
