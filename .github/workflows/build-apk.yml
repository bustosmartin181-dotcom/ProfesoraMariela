name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'iconos.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_FILE: ${{ github.workspace }}/planilla.keystore
      KS_PASS_IN: ${{ secrets.KEYSTORE_PASSWORD }}
      KS_P1_IN: ${{ secrets.KEYSTORE_PARTE1 }}
      KS_P2_IN: ${{ secrets.KEYSTORE_PARTE2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Armar carpeta web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permiso de camara
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Permiso de microfono
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n        <package android:name="com.mercadopago.wallet" />\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO\|RecognitionService" android/app/src/main/AndroidManifest.xml

      - name: Icono de la app
        run: unzip -o iconos.zip -d android/app/src/main/res/

      - name: Datos de Google para Drive
        run: |
          sed -i 's#</resources>#    <string name="server_client_id">194777348944-a70meqde749mkjb2uk212g51kiiurc61.apps.googleusercontent.com</string>\n</resources>#' android/app/src/main/res/values/strings.xml
          grep -n "server_client_id" android/app/src/main/res/values/strings.xml

      - name: Firma fija y numero de version
        run: |
          KS_PASS=$(printf '%s' "$KS_PASS_IN" | tr -d '[:space:]')
          KS_B64=$(printf '%s%s' "$KS_P1_IN" "$KS_P2_IN" | tr -d '[:space:]')
          echo "Largo parte 1: $(printf '%s' "$KS_P1_IN" | tr -d '[:space:]' | wc -c) (deberia ser 1800)"
          echo "Largo parte 2: $(printf '%s' "$KS_P2_IN" | tr -d '[:space:]' | wc -c) (deberia ser 1800)"
          echo "Largo de la contrasena: ${#KS_PASS} (deberia ser 28)"
          echo "Largo de la clave: ${#KS_B64} (deberia ser 3600)"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "ERROR: faltan los Secrets KEYSTORE_PARTE1, KEYSTORE_PARTE2 y/o KEYSTORE_PASSWORD en GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$KS_FILE" || { echo "ERROR: los Secrets KEYSTORE_PARTE1 y KEYSTORE_PARTE2 no se pudieron leer (cortados o con caracteres de mas)"; exit 1; }
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias planilla > kt.log 2>&1 || { cat kt.log; echo "ERROR: la clave o la contrasena de los Secrets no sirven"; exit 1; }
          echo "La clave de firma se abrio bien."
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/' android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "planilla"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
          }
          EOF

      - name: Complementos opcionales (dictado por voz y abrir Mercado Pago)
        run: |
          npm install @capacitor-community/speech-recognition@^6.0.0 --legacy-peer-deps || echo "AVISO: no se pudo instalar el dictado por voz; la app usa el microfono del teclado"
          npm install @capacitor/app-launcher@latest-6 --legacy-peer-deps || echo "AVISO: no se pudo instalar el abridor de apps; el boton de Mercado Pago solo copia el alias"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verificar la firma del APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          A=$(keytool -printcert -jarfile $APK | grep 'SHA1:' | head -1 | awk '{print $2}')
          K=$(keytool -list -v -keystore "$KS_FILE" -alias planilla -storepass "$KS_PASS" | grep 'SHA1:' | head -1 | awk '{print $2}')
          echo "Huella SHA-1 del APK:   $A"
          echo "Huella SHA-1 de la clave: $K"
          if [ "$A" != "$K" ]; then echo "ERROR: el APK no quedo firmado con la clave de los Secrets"; exit 1; fi

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: planilla-docente-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK como Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep -o "APP_VERSION='[0-9.]*'" index.html | grep -o "[0-9][0-9.]*")
          echo "Version de la app: $V"
          cp android/app/build/outputs/apk/debug/app-debug.apk PlanillaDocente.apk
          gh release create "v${V}-b${{ github.run_number }}" PlanillaDocente.apk --title "Planilla Docente ${V}" --notes "APK de la version ${V} (compilacion ${{ github.run_number }})." --latest
